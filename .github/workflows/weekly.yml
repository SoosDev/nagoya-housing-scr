name: Weekly refresh

on:
  schedule:
    - cron: "13 21 * * 0"   # Mondays 06:13 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "data/static/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      scrape: ${{ steps.scrape.outcome }}
    steps:
      # Check out the branch tip, not the triggering commit, so a run queued
      # behind another one starts from that run's data commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape SUUMO
        if: github.event_name != 'push'
        id: scrape
        continue-on-error: true
        run: python scripts/scrape.py
      - name: Build site
        run: python scripts/build.py
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Weekly data refresh $(date -u +%F)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Runs after deploy so the site still updates, but marks the run red.
  scrape-status:
    needs: [refresh, deploy]
    if: always() && needs.refresh.outputs.scrape == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Fail visibly if scraping failed
        run: |
          echo "::error::SUUMO scrape failed; the site was rebuilt from last week's data."
          exit 1
