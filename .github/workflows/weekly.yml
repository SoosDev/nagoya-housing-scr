name: Weekly refresh

on:
  schedule:
    - cron: "13 21 * * 0"   # Mondays 06:13 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "data/static/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape SUUMO
        if: github.event_name != 'push'
        id: scrape
        continue-on-error: true
        run: python scripts/scrape.py
      - name: Build site
        run: python scripts/build.py
      - name: Commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Weekly data refresh $(date -u +%F)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Fail visibly if scraping failed
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning::SUUMO scrape failed; the site was rebuilt from last week's data."

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
