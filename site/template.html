<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>East Nagoya home shortlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: header, filter bar, then list beside a map (desktop) or map above list (phone).
   Colours borrow from Nagoya subway signage; the Higashiyama-line yellow marks the selected home. */
:root{
  --ground:#E9EDF0; --panel:#FFFFFF; --ink:#17202E; --muted:#586375; --rule:#D3D9DF; --ctl:#C5CDD6;
  --head:#17202E; --head-sub:#B9C3D0; --head-rule:#4A5870;
  --sel:#FFF3C4; --sel-rule:#E3D59A; --yellow:#F5B700;
  --pin:#2D4E86; --caution:#C46A12; --caution-text:#9A520C; --avoid:#B42318;
  --f-ja:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-zh:"Noto Sans TC","BIZ UDPGothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ja);font-size:14px;line-height:1.5}
html[lang="zh-Hant"] body{font-family:var(--f-zh)}
.ja{font-family:var(--f-ja)}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
a{color:var(--pin)}
a:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
.muted{color:var(--muted)}

/* app shell: on desktop the page itself never scrolls; the list does */
.app{display:flex;flex-direction:column;min-height:100dvh}
@media (min-width:1000px){.app{height:100dvh}}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding:12px 24px;background:var(--head);color:#fff}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;min-width:0}
.brand h1{margin:0;font-size:21px;line-height:1.3;letter-spacing:.02em}
.brand p{margin:0;font-size:13px;color:var(--head-sub);max-width:72ch}
.tools{display:flex;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--head-rule);border-radius:6px;overflow:hidden}
.seg button{height:34px;padding:0 12px;border:0;background:transparent;color:#fff;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.ghost{height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--head-rule);background:transparent;color:#fff;cursor:pointer}

.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;padding:12px 24px 14px;background:var(--panel);border-bottom:1px solid var(--rule)}
.types{display:flex;flex-wrap:wrap;border:1px solid var(--ctl);border-radius:6px;overflow:hidden}
.types button{height:36px;padding:0 14px;border:0;border-left:1px solid var(--ctl);background:var(--panel);font-weight:700;cursor:pointer;white-space:nowrap}
.types button:first-child{border-left:0}
.types button[aria-pressed="true"]{background:var(--ink);color:#fff}
.types .n{font-weight:400;opacity:.75;margin-left:4px}
.chip{height:38px;padding:0 14px;border:1px solid var(--ctl);border-radius:6px;background:var(--panel);font-weight:700;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow)}
.chip .n{font-weight:400;margin-left:4px}
.more{display:contents}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.fld select,.fld input{height:36px;padding:0 8px;border:1px solid var(--ctl);border-radius:6px;background:var(--panel);color:var(--ink);font-size:14px;min-width:0}
.fld input{width:124px}
.filterBtn{display:none}

.split{flex:1 1 auto;min-height:0;display:flex}
.listpane{flex:0 0 460px;min-width:0;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--rule)}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;border-bottom:1px solid var(--rule)}
.listhead .count{font-weight:700}
.listhead .count .muted{font-weight:400;margin-left:10px}
.listhead label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.listhead select{height:32px;padding:0 6px;border:1px solid var(--ctl);border-radius:6px;background:var(--panel);color:var(--ink);font-size:13px}
.list{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain}
.empty{padding:28px 20px;color:var(--muted)}
.moreBtn{display:block;margin:16px auto 24px;height:40px;padding:0 18px;border:1px solid var(--ctl);border-radius:6px;background:var(--panel);font-weight:700;cursor:pointer}

/* one listing */
.row{border-bottom:1px solid var(--rule);background:var(--panel)}
.row.sel{background:var(--sel)}
.rowbtn{display:block;width:100%;padding:16px 20px 18px;border:0;background:transparent;text-align:left;cursor:pointer}
.row:not(.sel) .rowbtn:hover{background:#F6F8FA}
.rowbtn>span{display:flex;flex-wrap:wrap;align-items:center}
.r1{justify-content:space-between;align-items:baseline!important;gap:12px}
.price{display:flex;align-items:baseline;gap:2px}
.price b{font-size:26px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.price small{font-size:14px;font-weight:700}
.ptype{font-size:12px;color:var(--muted);white-space:nowrap}
.name{display:block!important;margin-top:2px;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts{gap:4px 14px;margin-top:6px}
.newtag{padding:1px 8px;border-radius:4px;background:var(--yellow);font-size:12px;font-weight:700}
.where{gap:6px 14px;margin-top:8px}
.stn{display:inline-flex;align-items:center;gap:4px}
.ln{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 3px;border-radius:4px;font-size:12px;font-weight:700;color:#fff;font-family:var(--f-ja)}
.ln-H{background:#F5B700;color:var(--ink)}.ln-M{background:#7A4FA0}.ln-T{background:#0072BC}.ln-S{background:#D8262E}.ln-ST{background:#8A9099}
.risk{gap:6px 16px;margin-top:8px;font-size:13px}
.flag{display:inline-flex;align-items:center;gap:6px}
.mk{display:inline-block;width:10px;height:10px;flex:none;border:2px solid var(--muted);background:#fff}
.mk.caution{border:0;background:var(--caution)}
.mk.avoid{border:0;background:var(--avoid)}
.mk.unknown{border-style:dashed}
.rv-2{color:var(--caution-text);font-weight:700}
.rv-3{color:var(--avoid);font-weight:700}
.rv-0,.rv-1,.rv-x{color:var(--muted)}
.details{padding:0 20px 18px}
.details dl{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px 12px;margin:0;padding-top:14px;border-top:1px solid var(--sel-rule);font-size:13px}
.details dt{color:var(--muted)}
.details dd{margin:0;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:6px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--ink);color:#fff;border:0}
.btn.primary:hover{color:#fff;background:#2B3850}
.btn.secondary{background:var(--panel);color:var(--ink);border:1px solid var(--ctl)}
.alts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;color:var(--muted)}
.alts a{display:inline-grid;place-items:center;min-width:28px;height:28px;border:1px solid var(--ctl);border-radius:4px;text-decoration:none;color:var(--ink)}
.showmap{display:none}

/* map */
.mappane{flex:1 1 auto;min-width:0;position:relative;background:#E2E7EB}
#map{position:absolute;inset:0}
.legend{position:absolute;left:16px;bottom:16px;z-index:2;max-width:calc(100% - 32px);display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--ctl);font-size:12px}
.legend .row1{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.legend .it{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff}
.dot.p{background:var(--pin);box-shadow:0 0 0 1px var(--pin)}
.dot.c{background:var(--caution);box-shadow:0 0 0 1px var(--caution)}
.dot.a{background:var(--avoid);box-shadow:0 0 0 1px var(--avoid)}
.dot.s{width:10px;height:10px;background:#fff;border-color:var(--ink)}
.track{width:22px;height:0;border-top:2px dashed var(--ink);opacity:.6}
.legend label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.legend input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.depth{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted)}
.sw{display:inline-block;width:14px;height:10px;margin-right:4px;vertical-align:-1px}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.stn-mk{display:flex;align-items:center;gap:3px;pointer-events:none}
.stn-mk i{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--ink);flex:none}
.stn-mk .ln{min-width:16px;height:16px;font-size:10px;border-radius:3px}
.stn-mk b{font-size:12px;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.zoomed-out .stn-mk .ln,.zoomed-out .stn-mk b{display:none}
.price-mk{padding:4px 8px;border-radius:4px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;font-family:var(--f-ja)}
.maplibregl-ctrl-group button{width:36px;height:36px}

dialog{max-width:min(720px,calc(100vw - 32px));max-height:calc(100dvh - 48px);padding:0;border:1px solid var(--ctl);border-radius:10px;color:var(--ink)}
dialog::backdrop{background:rgb(23 32 46 / .45)}
.dlg{padding:22px 26px 24px}
.dlg h2{margin:0 0 12px;font-size:19px}
.dlg h3{margin:18px 0 4px;font-size:15px}
.dlg p{margin:0 0 6px;max-width:68ch}
.dlg .close{float:right;height:36px;padding:0 14px;border:1px solid var(--ctl);border-radius:6px;background:var(--panel);cursor:pointer}

/* phone and narrow tablet: map on top, list below, filters behind a button */
@media (max-width:999px){
  .top{padding:10px 16px}
  .brand h1{font-size:18px}
  .filters{padding:10px 16px;gap:10px}
  .types{flex-wrap:nowrap;overflow-x:auto;max-width:100%;border:0;gap:8px;border-radius:0}
  .types button{height:36px;border:1px solid var(--ctl);border-radius:18px}
  .types button:first-child{border-left:1px solid var(--ctl)}
  .filterBtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--ctl);border-radius:6px;background:var(--panel);font-weight:700;cursor:pointer}
  .filterBtn .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--yellow);font-size:12px}
  .more{display:none}
  .more.open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
  .fld input{width:100%}
  .split{flex-direction:column}
  .mappane{order:-1;flex:none;height:46vh;min-height:300px;border-bottom:1px solid var(--rule)}
  .listpane{flex:none;border-right:0}
  .list{overflow:visible}
  .listhead{padding:10px 16px}
  .rowbtn{padding:14px 16px 16px}
  .details{padding:0 16px 16px}
  .details dl{grid-template-columns:104px minmax(0,1fr)}
  .showmap{display:inline-flex}
  .legend{left:8px;bottom:8px;padding:8px 10px;gap:6px}
  .legend .row1 .opt{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1 data-i="title"></h1>
      <p id="sub"></p>
    </div>
    <div class="tools">
      <div class="seg" role="group" id="langs" data-i-aria="language">
        <button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="zh" lang="zh-Hant">繁中</button>
      </div>
      <button type="button" class="ghost" id="aboutBtn" data-i="about"></button>
    </div>
  </header>

  <div class="filters">
    <div class="types" role="group" id="types" data-i-aria="typeLabel"></div>
    <button type="button" class="chip" id="fNew" aria-pressed="false"><span data-i="newOnly"></span><span class="n" id="newN"></span></button>
    <button type="button" class="filterBtn" id="filterBtn" aria-expanded="false" aria-controls="more">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>
      <span data-i="filters"></span><span class="badge" id="activeN" hidden></span>
    </button>
    <div class="more" id="more">
      <label class="fld"><span data-i="flood"></span><select id="fFlood"></select></label>
      <label class="fld"><span data-i="river"></span><select id="fRiver"></select></label>
      <label class="fld"><span data-i="school"></span><select id="fJH"></select></label>
      <label class="fld"><span data-i="ward"></span><select id="fWard"></select></label>
      <label class="fld"><span data-i="bedrooms"></span><select id="fRooms"></select></label>
      <label class="fld"><span data-i="maxPrice"></span><input id="fMax" type="number" inputmode="numeric" min="0" step="100" data-i-ph="noLimit"></label>
    </div>
  </div>

  <main class="split">
    <section class="listpane" aria-labelledby="count">
      <div class="listhead">
        <span class="count" id="count" aria-live="polite"></span>
        <label><span data-i="sort"></span><select id="fSort"></select></label>
      </div>
      <div class="list" id="list"></div>
    </section>
    <section class="mappane" id="mapPane" data-i-aria="map">
      <div id="map"></div>
      <div class="legend">
        <div class="row1">
          <span class="it"><i class="dot p"></i><span data-i="fNone"></span></span>
          <span class="it"><i class="dot c"></i><span data-i="fCaution"></span></span>
          <span class="it" id="lgAvoid" hidden><i class="dot a"></i><span data-i="fAvoid"></span></span>
          <span class="it opt"><i class="dot s"></i><span data-i="station"></span></span>
          <span class="it opt"><i class="track"></i><span data-i="subway"></span></span>
        </div>
        <label><input type="checkbox" id="fFloodMap"><span data-i="showFlood"></span></label>
        <div class="depth" id="depth" hidden>
          <span><i class="sw" style="background:#f7f5a9"></i><span data-i="lg1"></span></span>
          <span><i class="sw" style="background:#ffd8c0"></i><span data-i="lg2"></span></span>
          <span><i class="sw" style="background:#ffb7b7"></i><span data-i="lg3"></span></span>
          <span><i class="sw" style="background:#ff9191"></i><span data-i="lg4"></span></span>
          <span><i class="sw" style="background:#f285c9"></i><span data-i="lg5"></span></span>
        </div>
      </div>
    </section>
  </main>
</div>

<dialog id="about" aria-labelledby="aboutTitle">
  <div class="dlg">
    <form method="dialog"><button class="close" data-i="close"></button></form>
    <h2 id="aboutTitle" data-i="about"></h2>
    <div id="aboutBody"></div>
  </div>
</dialog>

<script>
const DATA = __DATA__;
const META = __META__;
const STATIONS = __STATIONS__;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ja = s => `<span class="ja" lang="ja">${esc(s)}</span>`;
const THIS_YEAR = new Date().getFullYear();

// Nagoya subway (and Meitetsu Seto line) service per station, for the line badges.
const LINE_OF = {'覚王山':['H'],'本山':['H','M'],'東山公園':['H'],'桜山':['S'],'一社':['H'],'八事':['M','T'],'自由ケ丘':['M'],'瑞穂運動場東':['M'],'いりなか':['T'],'星ケ丘':['H'],'茶屋ケ坂':['M'],'名古屋大学':['M'],'八事日赤':['M'],'塩釜口':['T'],'総合リハビリセンター':['M'],'瑞穂運動場西':['S'],'池下':['H'],'久屋大通':['M','S'],'森下':['ST'],'川名':['T'],'瑞穂区役所':['S'],'車道':['S'],'御器所':['T','S'],'新瑞橋':['S','M'],'清水':['ST'],'尼ケ坂':['ST'],'上社':['H'],'高岳':['S']};
const badges = st => (LINE_OF[st] || []).map(k => `<span class="ln ln-${k}">${k}</span>`).join('');
const TYPES = ['中古マンション', '新築マンション', '中古一戸建て', '新築一戸建て'];

const I18N = {
  en: {
    code: 'en', title: 'East Nagoya home shortlist', language: 'Language', about: 'About the data', close: 'Close',
    sub: (n, d) => `${n} homes for sale within 10 minutes of a station, in 12 school districts. Refreshed every Monday; last update ${d}.`,
    date: d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'}),
    typeLabel: 'Property type', all: 'All', newOnly: 'New this week', filters: 'Filters',
    flood: 'Flood flag', hideAvoid: 'Hide Avoid', noFlagOnly: 'No flag only', showAll: n => `Show all (incl. ${n} Avoid)`,
    river: 'River flood', anyDepth: 'Any depth', noneMapped: 'None mapped', under05: 'Under 0.5 m', under3: 'Under 3 m',
    school: 'School district', allDistricts: n => `All ${n} districts`, ward: 'Ward', allWards: 'All wards',
    bedrooms: 'Bedrooms', any: 'Any', bedN: n => `${n} or more`, maxPrice: 'Max price (万円)', noLimit: 'No limit',
    sort: 'Sort', sBest: 'Best match', sPriceUp: 'Price, low to high', sPriceDown: 'Price, high to low', sNew: 'Newest building', sLargest: 'Largest', sWalk: 'Shortest walk', sHigh: 'Highest ground',
    count: n => `${n} homes`, noLoc: n => `${n} not on the map`, empty: 'No homes match these filters. Loosen the flood or price filter to see more.', more: 'Show more',
    walk: m => `${m} min walk`, district: 'district', built: y => `Built ${y}`, newBuild: 'New build', ready: y => `Ready ${y}`, land: 'Land', isNew: 'New',
    fNone: 'No flag found', fNoneUnknown: 'No flag found, elevation unknown', fCaution: 'Caution', fAvoid: 'Avoid',
    rivers: ['No river flood mapped within 100 m', 'River flood under 0.5 m nearby', 'River flood 0.5 to 3 m nearby', 'River flood 3 to 5 m nearby', 'River flood 5 to 10 m nearby', 'River flood 10 m or more nearby'],
    rUnknown: 'River flood unknown', ads: n => `Listed by ${n} agents`,
    dAddress: 'Address', dSchools: 'Schools', dElev: 'Ground elevation', dWhy: 'Flag reason', dNear: 'Near the station', dWard: 'Ward damage, 8 Sept 2026',
    elev: e => `${e.toFixed(0)} m above sea level`, rel: r => Math.abs(r) < 0.5 ? ', about level with its surroundings' : r > 0 ? `, ${r.toFixed(0)} m above its surroundings` : `, ${(-r).toFixed(0)} m below its surroundings`, elevUnknown: 'Unknown (elevation lookup failed)',
    whyNone: 'Not in damage reports or hazard-map town lists, and the ground is not low.', whyUnchecked: 'Not in damage reports or hazard-map town lists. Elevation is unknown, so the low-ground checks did not run.',
    whyLow: n => `Low ground (${n} m); check the river and storm-surge hazard map`, whyLowSpot: n => `Local low spot (about ${n} m below its surroundings)`,
    near: (sm, sn, cl, pd) => `${sm ?? '?'} supermarkets${sn ? ` (nearest: ${sn})` : ''}, ${cl ?? '?'} clinics${pd ? `, ${pd} pediatric` : ''}`,
    wardDamage: (w, n) => `${n} homes damaged in ${w}`,
    openSuumo: 'Open on SUUMO', otherAds: 'Other agents’ ads', showOnMap: 'Show on map',
    map: 'Map', station: 'Station', subway: 'Subway track', showFlood: 'Show river flood depth (GSI, max scale)',
    lg1: 'under 0.5 m', lg2: '0.5 to 3 m', lg3: '3 to 5 m', lg4: '5 to 10 m', lg5: '10 m or more',
    mapFail: 'The map could not load. Check your connection and reload the page.',
    aboutHtml: `
<h3>Listings</h3><p>For-sale homes from SUUMO list pages in 千種・東・昭和・瑞穂・名東・天白, at most a 10-minute walk from a station, and used homes at most 25 years old. A refresh runs every Monday morning (JST). Prices and specs come from SUUMO list pages and are not checked against detail pages.</p>
<h3>One card per home</h3><p>Ads from different agents for the same home are merged when the type, 丁目, price and floor area match (and land area, for houses). The card links every agent's ad. Two genuinely separate units with identical price and size in the same 丁目 would also merge.</p>
<h3>School district</h3><p>Matched by 町名 and 丁目 against the city's official 通学区域 lists (as of 1 Sept 2026). Where the city splits a 丁目 by 番地, two schools appear; confirm with the ward office. The 12 districts are the ones real-estate sources cite most; no official ranking exists.</p>
<h3>Flood flag</h3><p>“Avoid”: the 町 is named in Sept 2026 damage reports or on the city hazard maps. “Caution”: partly on a map, next to 山崎川, below 10 m ground elevation, or more than 5 m below its immediate surroundings (GSI elevation). “No flag found” only means the research found nothing; it is not a clearance. “Elevation unknown” means the GSI lookup failed, so the low-ground checks did not run.</p>

async function baseStyle() {
  const st = await (await fetch('https://tiles.openfreemap.org/styles/positron')).json();
  const name = ['coalesce', ['get', 'name:ja'], ['get', 'name:nonlatin'], ['get', 'name']];  // Japanese place names
  st.layers = st.layers.filter(l => !/shield|oneway|highway-name-(path|minor)|airport/.test(l.id) && !(l.paint && l.paint['fill-pattern']));
  st.layers.forEach(l => { const t = l.layout && l.layout['text-field']; if (t && JSON.stringify(t).includes('name')) l.layout['text-field'] = name; });
  st.layers.filter(l => l.id === 'label_other').forEach(l => { l.paint = {...l.paint, 'text-color': '#9AA4AF'}; });  // quieter 町/丁目 names
  return st;
}
function pinsGeo() {
  const g = new Map();
  VIEW.forEach(r => { if (r.k == null) return; if (!g.has(r.k)) g.set(r.k, []); g.get(r.k).push(r); });
  return {type: 'FeatureCollection', features: [...g].map(([k, rs]) => ({type: 'Feature', geometry: {type: 'Point', coordinates: [rs[0].lo, rs[0].la]},
    properties: {k, n: rs.length, f: rs.some(r => r.f === 'Avoid') ? 'a' : rs.some(r => r.f === 'Caution') ? 'c' : 'p'}}))};
}
function bounds(rows) {
  const b = [[180, 90], [-180, -90]];
  rows.forEach(r => { if (r.k == null) return; b[0][0] = Math.min(b[0][0], r.lo); b[0][1] = Math.min(b[0][1], r.la); b[1][0] = Math.max(b[1][0], r.lo); b[1][1] = Math.max(b[1][1], r.la); });
  return b[0][0] > b[1][0] ? null : b;
}
function addStations() {
  STATIONS.forEach(([n, la, lo]) => {
    const el = document.createElement('div');
    el.className = 'stn-mk';
    el.innerHTML = `<i></i>${badges(n)}<b class="ja" lang="ja">${esc(n)}</b>`;
    new maplibregl.Marker({element: el, anchor: 'left', offset: [-6, 0]}).setLngLat([lo, la]).addTo(map);
  });
}
function addLayers() {
  map.addSource('flood', {type: 'raster', tileSize: 256, minzoom: 2, maxzoom: 17,
    tiles: ['https://disaportaldata.gsi.go.jp/raster/01_flood_l2_shinsuishin_data/{z}/{x}/{y}.png'],
    attribution: '洪水浸水想定: <a href="https://disaportal.gsi.go.jp/" target="_blank" rel="noopener">国土地理院 重ねるハザードマップ</a>'});
  const firstLabel = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
  map.addLayer({id: 'flood', type: 'raster', source: 'flood', paint: {'raster-opacity': 0.6}, layout: {visibility: $('fFloodMap').checked ? 'visible' : 'none'}}, firstLabel);
  map.addLayer({id: 'subway', type: 'line', source: 'openmaptiles', 'source-layer': 'transportation',
    filter: ['all', ['==', ['get', 'class'], 'transit'], ['==', ['get', 'brunnel'], 'tunnel']],
    paint: {'line-color': '#17202E', 'line-opacity': 0.55, 'line-width': ['interpolate', ['linear'], ['zoom'], 11, 1.2, 15, 2.5], 'line-dasharray': [2, 1.5]}}, firstLabel);
  map.addSource('pins', {type: 'geojson', data: pinsGeo()});
  const r = (lo, hi) => ['interpolate', ['linear'], ['zoom'], 11, ['interpolate', ['linear'], ['get', 'n'], 1, lo[0], 10, lo[1]], 15, ['interpolate', ['linear'], ['get', 'n'], 1, hi[0], 10, hi[1]]];
  map.addLayer({id: 'pins', type: 'circle', source: 'pins', paint: {
    'circle-radius': r([4, 8], [7, 13]), 'circle-color': ['match', ['get', 'f'], 'a', '#B42318', 'c', '#C46A12', '#2D4E86'],
    'circle-stroke-color': '#FFFFFF', 'circle-stroke-width': 2}});
  map.addLayer({id: 'pin-n', type: 'symbol', source: 'pins', filter: ['>', ['get', 'n'], 1], layout: {
    'text-field': ['to-string', ['get', 'n']], 'text-font': ['Noto Sans Bold'], 'text-size': ['interpolate', ['linear'], ['zoom'], 11, 8, 15, 11],
    'text-allow-overlap': true, 'text-ignore-placement': true}, paint: {'text-color': '#FFFFFF'}});
  map.addLayer({id: 'pin-hover', type: 'circle', source: 'pins', filter: ['==', ['get', 'k'], ''], paint: {
    'circle-radius': r([7, 10], [10, 15]), 'circle-color': 'rgba(0,0,0,0)', 'circle-stroke-color': '#17202E', 'circle-stroke-width': 3}});
  map.addLayer({id: 'pin-sel', type: 'circle', source: 'pins', filter: ['==', ['get', 'k'], ''], paint: {
    'circle-radius': r([8, 11], [11, 16]), 'circle-color': '#F5B700', 'circle-stroke-color': '#17202E', 'circle-stroke-width': 3}});
}
function drawPins(fit) {
  if (!map || !map.getSource('pins')) return;
  map.getSource('pins').setData(pinsGeo());
  $('lgAvoid').hidden = !VIEW.some(r => r.f === 'Avoid');
  updateSelection();
  const b = bounds(VIEW);
  if (fit && b) map.fitBounds(b, {padding: 50, maxZoom: 15, duration: 500});
}
function hover(r) {
  if (map && map.getLayer('pin-hover')) map.setFilter('pin-hover', ['==', ['get', 'k'], r && r.k ? r.k : '']);
}
function updatePriceMarker() {
  if (!map) return;
  const r = S.sel != null ? DATA[S.sel] : null;
  if (!r || r.k == null) { priceMarker?.remove(); priceMarker = null; return; }
  const [pm, pu] = price(r);
  if (!priceMarker) { const el = document.createElement('div'); el.className = 'price-mk'; priceMarker = new maplibregl.Marker({element: el, anchor: 'top', offset: [0, 14]}); }
  priceMarker.getElement().textContent = pm + pu;
  priceMarker.setLngLat([r.lo, r.la]).addTo(map);
}
function updateSelection() {
  const r = S.sel != null ? DATA[S.sel] : null;
  if (map && map.getLayer('pin-sel')) map.setFilter('pin-sel', ['==', ['get', 'k'], r && r.k ? r.k : '']);
  updatePriceMarker();
}
function focusPin(r, force) {
  if (!map || !r || r.k == null) return;
  const inView = map.getBounds().contains([r.lo, r.la]);
  if (force || !inView || map.getZoom() < 13) map.easeTo({center: [r.lo, r.la], zoom: Math.max(map.getZoom(), 14), duration: 600});
}
async function initMap() {
  try {
    await loadLib();
    const style = await baseStyle();
    map = new maplibregl.Map({container: 'map', style, bounds: bounds(VIEW) || [[136.9, 35.1], [137.03, 35.2]], fitBoundsOptions: {padding: 50},
      attributionControl: {compact: true}, dragRotate: false, pitchWithRotate: false, cooperativeGestures: matchMedia('(pointer: coarse)').matches});
    map.touchZoomRotate.disableRotation();
    map.addControl(new maplibregl.NavigationControl({showCompass: false}), 'top-right');
    const zoomClass = () => $('map').classList.toggle('zoomed-out', map.getZoom() < 12.3);
    map.on('load', () => { addLayers(); addStations(); drawPins(false); zoomClass(); });
    map.on('zoomend', zoomClass);
    map.on('click', 'pins', e => {
      const k = e.features[0].properties.k;
      const first = VIEW.find(r => r.k === k);
      if (first) select(first.id, {fromMap: true});
    });
    map.on('mouseenter', 'pins', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'pins', () => map.getCanvas().style.cursor = '');
  } catch (e) {
    $('map').innerHTML = `<p class="mapmsg">${esc(T().mapFail)}</p>`;
  }
}
$('fFloodMap').addEventListener('change', e => {
  $('depth').hidden = !e.target.checked;
  if (map?.getLayer('flood')) map.setLayoutProperty('flood', 'visibility', e.target.checked ? 'visible' : 'none');
});

compute();
applyLang();
initMap();
</script>
</body>
